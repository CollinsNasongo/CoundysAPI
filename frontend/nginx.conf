server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API itself plus its interactive docs live on the FastAPI service:
    #   /api/v1/...                 JSON endpoints (and /api/v1/openapi.json)
    #   /docs, /redoc               Swagger UI and ReDoc
    #   /health                     liveness probe
    location ~ ^/(api/|docs|redoc|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
